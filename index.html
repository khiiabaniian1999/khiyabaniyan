<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>در حال توسعه | Khiyabaniyan</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101827;
    color: #f1f5f9;
    font-family: Tahoma, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    padding: 30px;
    max-width: 650px;
}

.gears {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin-bottom: 35px;
    color: #c5a66b;
}

.gear {
    font-size: 90px;
    display: inline-block;
    animation: rotate 12s linear infinite;
}

.gear.small {
    font-size: 60px;
    animation-direction: reverse;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.line {
    width: 55px;
    height: 2px;
    background: #c5a66b;
    margin: 25px auto;
}

h1 {
    font-size: 30px;
    font-weight: 500;
    margin-bottom: 18px;
}

p {
    color: #aab5c5;
    font-size: 15px;
    line-height: 2.5;
}

.english {
    direction: ltr;
    font-size: 11px;
    letter-spacing: 4px;
    color: #c5a66b;
    margin-top: 45px;
}

footer {
    position: fixed;
    bottom: 25px;
    color: #64748b;
    font-size: 12px;
}

@media (max-width: 600px) {
    h1 { font-size: 24px; }
    .gear { font-size: 75px; }
    .gear.small { font-size: 48px; }
    p { font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
    .gear { animation: none; }
}
</style>
</head>

<body>

<div class="container">

    <div class="gears">
        <span class="gear">⚙</span>
        <span class="gear small">⚙</span>
    </div>

    <h1>وب‌سایت در حال توسعه است</h1>

    <div class="line"></div>

    <p>
        این وب‌سایت با هدف ارائه فعالیت‌های علمی،
        پژوهشی و دانشگاهی در حوزه حقوق
        در حال آماده‌سازی است.
        <br>
        به‌زودی بازخواهیم گشت.
    </p>

    <div class="english">
        WEBSITE UNDER DEVELOPMENT
    </div>

</div>

<footer>
    khiyabaniyan.ir
</footer>

</body>
</html>
